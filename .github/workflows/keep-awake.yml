name: Keep Supabase awake

# Supabase pauses free projects after about a week without activity. This
# reads one row every 3 days so LotPulse never goes to sleep between uses.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (the same public values as VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY).

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/reports?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null
          echo "Supabase answered, so the project stays awake."
